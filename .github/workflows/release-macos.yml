name: macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      GH_TOKEN: ${{ github.token }}
      KESTREL_UPDATE_URL: ${{ vars.KESTREL_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm verify
      - run: corepack pnpm audit --prod
      - name: Verify real managed local AI on Apple Silicon
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          corepack pnpm test:local-ai:real
      - name: Require release credentials
        shell: bash
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$CSC_INSTALLER_LINK"
          test -n "$CSC_INSTALLER_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          [[ "$KESTREL_UPDATE_URL" == https://* ]]
      - name: Build signed Apple Silicon DMG, ZIP, and MDM PKG
        run: corepack pnpm --filter @kestrel/desktop exec electron-builder --mac dmg zip pkg --arm64 --publish never --config electron-builder.yml
      - name: Verify signature and Gatekeeper
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Kestrel.app
          xcrun stapler validate release/mac-arm64/Kestrel.app
          spctl --assess --type execute --verbose=4 release/mac-arm64/Kestrel.app
          test "$(lipo -archs release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel)" = "arm64"
          pkgutil --check-signature release/*.pkg
      - name: Smoke-test the signed packaged application
        run: corepack pnpm test:packaged-desktop:arm64
      - name: Create checksummed release manifest
        shell: bash
        run: |
          test -f release/latest-mac.yml
          node scripts/create-release-manifest.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-macos-apple-silicon
          path: |
            release/*.dmg
            release/*.zip
            release/*.pkg
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error
      - name: Publish verified tag artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/*.pkg release/*.blockmap release/latest-mac.yml release/SHA256SUMS release/release-manifest.json --clobber
