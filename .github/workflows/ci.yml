name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, website, and security (macOS)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install chromium
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm audit --prod
      - run: corepack pnpm assets:verify
      - run: corepack pnpm audit:references
      - run: corepack pnpm verify:openclaw2
      - run: corepack pnpm audit:market
      - run: corepack pnpm build
      - run: corepack pnpm test:e2e
      - run: corepack pnpm test:packaged-cli
      - run: corepack pnpm test:editors
      - run: corepack pnpm test:security

  desktop:
    name: Desktop and packaged arm64 smoke
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      npm_config_arch: arm64
      npm_config_target_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:desktop
      - run: corepack pnpm benchmark:browser-agent --report .tmp/browser-agent-benchmark/ci-development.json
      - run: corepack pnpm test:desktop-file-icon-guard
      - run: corepack pnpm test
      - run: corepack pnpm test:desktop-smoke
      - run: corepack pnpm test:desktop-single-instance
      - run: corepack pnpm test:desktop-restart-recovery
      - run: corepack pnpm test:desktop-workflow-reuse
      - run: corepack pnpm test:desktop-writing-studio
      - run: corepack pnpm test:desktop-browser
      - run: corepack pnpm test:desktop-setup
      - run: corepack pnpm test:desktop-fresh-profile
      - run: corepack pnpm test:desktop-personas
      - run: corepack pnpm test:desktop-kanban
      - run: corepack pnpm test:desktop-model-routing
      - run: corepack pnpm test:desktop-readiness
      - run: corepack pnpm test:desktop-external-secrets
      - run: corepack pnpm test:desktop-observability
      - run: corepack pnpm test:desktop-life-context
      - run: corepack pnpm test:desktop-approvals
      - run: corepack pnpm test:desktop-chat-configuration
      - run: corepack pnpm test:desktop-managed-policy
      - run: corepack pnpm package:mac:dev
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-restart-recovery
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-workflow-reuse
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-layout
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-file-icon-guard
      - run: corepack pnpm test:packaged-desktop:arm64
      - run: corepack pnpm benchmark:browser-agent:packaged:arm64 --report .tmp/browser-agent-benchmark/ci-packaged.json
      - name: Upload browser-agent benchmark reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-agent-benchmark-${{ github.run_attempt }}
          path: .tmp/browser-agent-benchmark/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Capture desktop failure diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p .tmp/ci-diagnostics
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "node=$(node --version 2>/dev/null || true)"
            echo "pnpm=$(corepack pnpm --version 2>/dev/null || true)"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .tmp/ci-diagnostics/run.txt
          uname -a > .tmp/ci-diagnostics/uname.txt 2>&1
          ps -axo pid=,ppid=,stat=,command= > .tmp/ci-diagnostics/processes.txt 2>&1
          grep -E 'Electron|Kestrel|electron-vite|playwright|browser fixture' .tmp/ci-diagnostics/processes.txt > .tmp/ci-diagnostics/relevant-processes.txt || true
      - name: Upload desktop failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-failure-evidence-${{ github.run_attempt }}
          path: |
            .tmp/desktop-layout/**
            .tmp/browser-agent-benchmark/*.json
            .tmp/ci-diagnostics/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
