name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, website, and security (macOS)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install chromium
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: KESTREL_SOURCE_BENCHMARK_REPORT=.tmp/source-ingestion-benchmark/ci.json corepack pnpm benchmark:source-ingestion
      - name: Upload source-ingestion benchmark report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-ingestion-benchmark-${{ github.run_attempt }}
          path: .tmp/source-ingestion-benchmark/*.json
          if-no-files-found: warn
          retention-days: 14
      - run: corepack pnpm audit:dependencies
      - run: corepack pnpm assets:verify
      - run: corepack pnpm audit:references
      - run: corepack pnpm verify:openclaw2
      - run: corepack pnpm audit:market
      - run: corepack pnpm build
      - run: corepack pnpm test:node-core
      - run: corepack pnpm test:chromium-host
      - run: corepack pnpm test:app-page-interaction
      - run: corepack pnpm test:native-extensions
      - name: Verify native renderer, durable Core and isolated browsing
        env:
          KESTREL_NATIVE_TEST_APP: ${{ github.workspace }}/.tmp/native-chromium-host/Kestrel.app
          KESTREL_TEST_NATIVE_PROVIDERS: "1"
          KESTREL_TEST_NATIVE_ISOLATED_AUTOMATION: "1"
          KESTREL_TEST_NATIVE_FORM_NAVIGATION: "1"
          KESTREL_TEST_NATIVE_ISOLATED_DOWNLOADS: "1"
          KESTREL_TEST_NATIVE_CONTEXT_ATTACHMENTS: "1"
          KESTREL_TEST_NATIVE_LEGACY_CONFLICTS: "1"
          KESTREL_TEST_NATIVE_WORKSPACE_FIXTURE: "1"
        run: |
          corepack pnpm test:native-user-extensions
          corepack pnpm test:native-chromium-core-relay
          corepack pnpm test:native-core-durability
          corepack pnpm test:native-pending-projects
          corepack pnpm test:native-project-handoff
          corepack pnpm test:project-reconnection-settings
          corepack pnpm test:native-browser-backend
          corepack pnpm test:native-isolated-automation
          corepack pnpm test:chromium-native-auth
          corepack pnpm test:chromium-provider-store
          corepack pnpm test:chromium-context-dialog
          corepack pnpm test:chromium-readiness
          corepack pnpm test:chromium-system-integration
          corepack pnpm test:chromium-external-urls
          corepack pnpm test:chromium-browser-settings
          corepack pnpm test:native-voice
          corepack pnpm test:chromium-desktop
      - name: Verify reviewed native history transfer
        run: |
          ditto --rsrc --extattr --acl .tmp/native-chromium-host/Kestrel.app .tmp/native-history-transfer-ci-host/Kestrel.app
          KESTREL_NATIVE_TEST_APP="$GITHUB_WORKSPACE/.tmp/native-history-transfer-ci-host/Kestrel.app" corepack pnpm test:native-history-transfer
      - name: Verify bounded large Core file transfers
        env:
          KESTREL_NATIVE_TEST_APP: ${{ github.workspace }}/.tmp/native-chromium-host/Kestrel.app
          KESTREL_NATIVE_LARGE_CORE_EVIDENCE: ${{ github.workspace }}/.tmp/native-large-core-transfer-evidence
        run: corepack pnpm test:native-large-core-transfer
      - name: Upload native extension compatibility evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-extension-compatibility-${{ github.run_attempt }}
          # .tmp is hidden; allow only generated evidence, never profile trees.
          include-hidden-files: true
          path: |
            .tmp/native-user-extension-evidence/compatibility.json
            .tmp/native-user-extension-evidence/action-popup.json
            .tmp/native-user-extension-evidence/tab-ownership.json
            .tmp/native-user-extension-evidence/*.png
            .tmp/chromium-desktop-evidence/receipt.json
            .tmp/chromium-desktop-evidence/native-download-diagnostics.json
            .tmp/chromium-desktop-evidence/*.png
            .tmp/chromium-desktop-evidence/runtime.log
            .tmp/chromium-desktop-evidence/failure.log
            .tmp/browser-app-page-evidence/receipt.json
            .tmp/browser-app-page-evidence/desktop.png
            .tmp/browser-app-page-evidence/compact.png
            .tmp/browser-app-page-evidence/failure.png
            .tmp/native-voice-*/receipt.json
            .tmp/native-voice-*/*.png
            .tmp/native-context-dialog-evidence/receipt.json
            .tmp/native-browser-settings-evidence/receipt.json
            .tmp/native-browser-settings-evidence/*.png
            .tmp/native-browser-settings-evidence/runtime.log
            .tmp/native-large-core-transfer-evidence/receipt.json
            .tmp/native-pending-project-evidence/receipt.json
            .tmp/native-project-handoff-evidence/receipt.json
            .tmp/project-reconnection-settings-evidence/receipt.json
            .tmp/project-reconnection-settings-evidence/*.png
            .tmp/native-history-transfer-*/receipt.json
            .tmp/native-history-transfer-*/*.png
          if-no-files-found: warn
          retention-days: 14
      - run: corepack pnpm test:e2e
      - run: corepack pnpm test:packaged-cli
      - run: corepack pnpm test:editors
      - run: corepack pnpm test:security

  native_system_storage:
    name: Native system-configured cookie diagnostic (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      npm_config_arch: arm64
      npm_config_target_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: node scripts/build-native-chromium-host.mjs --output .tmp/native-system-storage-ci-host
      - name: Test generated-profile system Keychain cookie storage
        env:
          KESTREL_NATIVE_TEST_APP: ${{ github.workspace }}/.tmp/native-system-storage-ci-host/Kestrel.app
          KESTREL_TEST_NATIVE_REAL_BROWSER_KEYCHAIN: "1"
        run: corepack pnpm test:native-real-browser-storage
      - name: Upload system storage receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-system-storage-${{ github.run_attempt }}
          include-hidden-files: true
          path: .tmp/native-real-browser-storage-*/receipt.json
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: Desktop and packaged arm64 smoke
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      npm_config_arch: arm64
      npm_config_target_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:desktop
      - run: corepack pnpm benchmark:browser-agent --report .tmp/browser-agent-benchmark/ci-development.json
      - run: corepack pnpm test:desktop-file-icon-guard
      - run: corepack pnpm test
      - run: corepack pnpm test:desktop-smoke
      - run: corepack pnpm test:desktop-single-instance
      - run: corepack pnpm test:desktop-restart-recovery
      - run: corepack pnpm test:desktop-workflow-reuse
      - run: corepack pnpm test:desktop-writing-studio
      - run: corepack pnpm test:desktop-browser
      - run: corepack pnpm test:desktop-autofill
      - run: corepack pnpm test:desktop-setup
      - run: corepack pnpm test:desktop-fresh-profile
      - run: corepack pnpm test:desktop-personas
      - run: corepack pnpm test:desktop-kanban
      - run: corepack pnpm test:desktop-model-routing
      - run: corepack pnpm test:desktop-subscription-cli-safety
      - run: corepack pnpm test:desktop-readiness
      - run: corepack pnpm test:desktop-external-secrets
      - run: corepack pnpm test:desktop-observability
      - run: corepack pnpm test:desktop-life-context
      - run: corepack pnpm test:desktop-approvals
      - run: corepack pnpm test:desktop-chat-configuration
      - run: corepack pnpm test:desktop-managed-policy
      - run: corepack pnpm package:mac:dev
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-restart-recovery
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-workflow-reuse
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-layout
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-file-icon-guard
      - run: KESTREL_DESKTOP_EXECUTABLE=release/mac-arm64/Kestrel.app/Contents/MacOS/Kestrel corepack pnpm test:desktop-subscription-cli-safety
      - run: corepack pnpm test:packaged-desktop:arm64
      - run: corepack pnpm benchmark:browser-agent:packaged:arm64 --report .tmp/browser-agent-benchmark/ci-packaged.json
      - name: Upload browser-agent benchmark reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-agent-benchmark-${{ github.run_attempt }}
          path: .tmp/browser-agent-benchmark/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Capture desktop failure diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p .tmp/ci-diagnostics
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "node=$(node --version 2>/dev/null || true)"
            echo "pnpm=$(corepack pnpm --version 2>/dev/null || true)"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .tmp/ci-diagnostics/run.txt
          uname -a > .tmp/ci-diagnostics/uname.txt 2>&1
          ps -axo pid=,ppid=,stat=,command= > .tmp/ci-diagnostics/processes.txt 2>&1
          grep -E 'Electron|Kestrel|electron-vite|playwright|browser fixture' .tmp/ci-diagnostics/processes.txt > .tmp/ci-diagnostics/relevant-processes.txt || true
      - name: Upload desktop failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-failure-evidence-${{ github.run_attempt }}
          path: |
            .tmp/desktop-layout/**
            .tmp/browser-agent-benchmark/*.json
            .tmp/ci-diagnostics/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
