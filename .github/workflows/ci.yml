name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, website, and security (macOS)
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install chromium
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: KESTREL_SOURCE_BENCHMARK_REPORT=.tmp/source-ingestion-benchmark/ci.json corepack pnpm benchmark:source-ingestion
      - name: Upload source-ingestion benchmark report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-ingestion-benchmark-${{ github.run_attempt }}
          path: .tmp/source-ingestion-benchmark/*.json
          if-no-files-found: warn
          retention-days: 14
      - run: corepack pnpm audit
      - run: corepack pnpm assets:verify
      - run: corepack pnpm audit:references
      - run: corepack pnpm verify:openclaw2
      - run: corepack pnpm audit:market
      - run: corepack pnpm build
      - run: corepack pnpm test:node-core
      - run: corepack pnpm test:chromium-host
      - run: corepack pnpm test:electron-native-transfer
      - run: corepack pnpm test:electron-native-transfer-cli
      - run: corepack pnpm verify:chromium-product-path
      - name: Build native Chromium host once for retirement-gate smokes
        run: corepack pnpm build:native-chromium-host -- --output .tmp/ci-native-chromium-host
      - name: Native Chromium retirement-gate smokes
        env:
          KESTREL_NATIVE_TEST_APP: ${{ github.workspace }}/.tmp/ci-native-chromium-host/Kestrel.app
        run: |
          set -euo pipefail
          corepack pnpm test:native-extensions
          corepack pnpm test:native-user-extensions
          corepack pnpm test:native-chromium-host
          corepack pnpm test:native-chromium-core-relay
          corepack pnpm test:native-desktop-shell
          corepack pnpm test:native-browser-backend
          corepack pnpm test:native-isolated-automation
          corepack pnpm test:native-durable-browser-library
          corepack pnpm test:native-download-capture
          corepack pnpm test:native-credential-bootstrap
          corepack pnpm test:native-zero-electron-bundle
          corepack pnpm test:native-dock-canonical
      - run: corepack pnpm test:e2e
      - run: corepack pnpm test:packaged-cli
      - run: corepack pnpm test:editors
      - run: corepack pnpm test:security

  desktop:
    name: Desktop and packaged arm64 smoke
    runs-on: macos-15
    timeout-minutes: 55
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      npm_config_arch: arm64
      npm_config_target_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:desktop
      - run: corepack pnpm test
      - name: Package native Chromium product path and run packaged native smokes
        run: |
          set -euo pipefail
          corepack pnpm package:mac:dev
          corepack pnpm test:packaged-native:arm64
          corepack pnpm test:packaged-native-desktop-shell:arm64
          corepack pnpm test:packaged-native-zero-electron-bundle:arm64
          corepack pnpm test:packaged-native-dock-canonical:arm64
          KESTREL_NATIVE_TEST_APP=release/native-mac-arm64/Kestrel.app corepack pnpm test:native-chromium-core-relay
      - name: Capture desktop failure diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          mkdir -p .tmp/ci-diagnostics
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "node=$(node --version 2>/dev/null || true)"
            echo "pnpm=$(corepack pnpm --version 2>/dev/null || true)"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > .tmp/ci-diagnostics/run.txt
          uname -a > .tmp/ci-diagnostics/uname.txt 2>&1
          ps -axo pid=,ppid=,stat=,command= > .tmp/ci-diagnostics/processes.txt 2>&1
          grep -E 'Electron|Kestrel|Chromium|playwright|browser fixture' .tmp/ci-diagnostics/processes.txt > .tmp/ci-diagnostics/relevant-processes.txt || true
      - name: Upload desktop failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-failure-evidence-${{ github.run_attempt }}
          path: |
            .tmp/ci-diagnostics/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
