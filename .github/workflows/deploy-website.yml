name: Deploy product website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-website.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - name: Build static website
        env:
          NEXT_PUBLIC_BASE_PATH: /kestrel-agent
          NEXT_PUBLIC_SITE_URL: https://arnavsri993.github.io/kestrel-agent
          NEXT_PUBLIC_PUBLISHER_NAME: ${{ vars.PUBLIC_PUBLISHER_NAME }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_RELEASE_STATUS: ${{ vars.NEXT_PUBLIC_RELEASE_STATUS }}
          NEXT_PUBLIC_RELEASE_VERSION: ${{ vars.NEXT_PUBLIC_RELEASE_VERSION }}
          NEXT_PUBLIC_DOWNLOAD_URL: ${{ vars.NEXT_PUBLIC_DOWNLOAD_URL }}
          NEXT_PUBLIC_RELEASE_MANIFEST_URL: ${{ vars.NEXT_PUBLIC_RELEASE_MANIFEST_URL }}
          NEXT_PUBLIC_RELEASE_CHECKSUMS_URL: ${{ vars.NEXT_PUBLIC_RELEASE_CHECKSUMS_URL }}
        run: corepack pnpm build:website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
