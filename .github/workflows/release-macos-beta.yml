name: macOS beta release

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm verify
      - run: corepack pnpm audit --prod
      - name: Verify real managed local AI on Apple Silicon
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          corepack pnpm test:local-ai:real

  sign-and-package:
    needs: verify-source
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: macos-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Require a beta release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Require release credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$CSC_INSTALLER_LINK"
          test -n "$CSC_INSTALLER_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Build signed Apple Silicon beta DMG, ZIP, and MDM PKG
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: corepack pnpm --filter @kestrel/desktop exec electron-builder --mac dmg zip pkg --arm64 --publish never --config electron-builder.beta.yml
      - name: Verify signature and Gatekeeper
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/Kestrel Beta.app
          xcrun stapler validate "release/mac-arm64/Kestrel Beta.app"
          spctl --assess --type execute --verbose=4 "release/mac-arm64/Kestrel Beta.app"
          test "$(lipo -archs "release/mac-arm64/Kestrel Beta.app/Contents/MacOS/Kestrel Beta")" = "arm64"
          pkgutil --check-signature release/*.pkg
      - name: Smoke-test the signed packaged beta
        env:
          KESTREL_RELEASE_CHANNEL: beta
          KESTREL_DISABLE_UPDATES: "1"
          KESTREL_DESKTOP_EXECUTABLE: "release/mac-arm64/Kestrel Beta.app/Contents/MacOS/Kestrel Beta"
          KESTREL_UPDATE_METADATA: beta-mac.yml
        run: node scripts/smoke-desktop.mjs
      - name: Create checksummed beta release manifest
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f release/beta-mac.yml
          node scripts/create-release-manifest.mjs release
          KESTREL_UPDATE_METADATA=beta-mac.yml node scripts/verify-release-bundle.mjs release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kestrel-macos-apple-silicon-beta
          path: |
            release/*.dmg
            release/*.zip
            release/*.pkg
            release/*.blockmap
            release/beta-mac.yml
            release/SHA256SUMS
            release/release-manifest.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: sign-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kestrel-macos-apple-silicon-beta
          path: release
      - name: Verify downloaded beta release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f release/beta-mac.yml
          test -f release/SHA256SUMS
          test -f release/release-manifest.json
          compgen -G "release/*.dmg" >/dev/null
          compgen -G "release/*.zip" >/dev/null
          compgen -G "release/*.pkg" >/dev/null
          compgen -G "release/*.blockmap" >/dev/null
          (cd release && sha256sum --check SHA256SUMS)
          KESTREL_UPDATE_METADATA=beta-mac.yml node scripts/verify-release-bundle.mjs release
      - name: Verify tag still points to the packaged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resolved_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          test "$resolved_commit" = "$GITHUB_SHA"
      - name: Publish verified beta tag artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_assets=(
            release/*.dmg
            release/*.zip
            release/*.pkg
            release/*.blockmap
            release/beta-mac.yml
            release/SHA256SUMS
            release/release-manifest.json
          )
          draft_marker="<!-- kestrel-beta-release-commit:$GITHUB_SHA -->"
          if release_json="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,body,assets 2>/dev/null)"; then
            if [[ "$(jq -r .isDraft <<<"$release_json")" != "true" ]] ||
              [[ "$(jq -r .isPrerelease <<<"$release_json")" != "true" ]] ||
              [[ "$(jq -r .body <<<"$release_json")" != *"$draft_marker"* ]]; then
              echo "::error::Release $GITHUB_REF_NAME already exists and is not this workflow's matching beta draft."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --notes "$draft_marker" \
              --draft \
              --prerelease
            release_json="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,body,assets)"
          fi

          for asset_path in "${release_assets[@]}"; do
            asset_name="$(basename "$asset_path")"
            existing_asset="$(
              jq -r --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | [.size, .digest, .state] | @tsv' \
                <<<"$release_json"
            )"
            if [[ -z "$existing_asset" ]]; then
              gh release upload "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                "$asset_path"
              continue
            fi
            IFS=$'\t' read -r remote_bytes remote_digest remote_state <<<"$existing_asset"
            local_bytes="$(stat --format=%s "$asset_path")"
            local_digest="sha256:$(sha256sum "$asset_path" | cut -d ' ' -f1)"
            if [[ "$remote_state" != "uploaded" ]] ||
              [[ "$remote_bytes" != "$local_bytes" ]] ||
              [[ "$remote_digest" != "$local_digest" ]]; then
              echo "::error::Existing beta draft asset $asset_name does not match the verified bundle."
              exit 1
            fi
          done

          release_json="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets)"
          if [[ "$(jq '.assets | length' <<<"$release_json")" -ne "${#release_assets[@]}" ]]; then
            echo "::error::Beta draft release contains an unexpected asset set."
            exit 1
          fi
          for asset_path in "${release_assets[@]}"; do
            asset_name="$(basename "$asset_path")"
            local_bytes="$(stat --format=%s "$asset_path")"
            local_digest="sha256:$(sha256sum "$asset_path" | cut -d ' ' -f1)"
            jq -e \
              --arg name "$asset_name" \
              --arg digest "$local_digest" \
              --argjson size "$local_bytes" \
              '.assets | any(.name == $name and .digest == $digest and .size == $size and .state == "uploaded")' \
              <<<"$release_json" >/dev/null
          done
          resolved_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          test "$resolved_commit" = "$GITHUB_SHA"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease
