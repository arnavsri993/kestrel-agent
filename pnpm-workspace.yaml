packages:
  - apps/*
  - packages/*

# Universal macOS packaging needs both Sharp/libvips optional binary families
# available in the shared pnpm install before electron-builder splits arches.
# The Linux CI job also needs its Rollup native optional package installed.
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - arm64
    - x64

allowBuilds:
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
  sharp: true

overrides:
  brace-expansion: 5.0.8
  esbuild: 0.28.1
  postcss: 8.5.23
  sharp: 0.35.3

minimumReleaseAgeExclude:
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - better-sqlite3@13.0.1
  - electron@43.2.0
  - next@16.2.11
  - react-dom@19.2.8
  - react@19.2.8
