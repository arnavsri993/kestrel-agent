packages:
  - apps/*
  - packages/*

# Optional native packages follow the host that runs install. The desktop app
# ships only Apple Silicon arm64, so M1 and later Macs share one binary family.
# Website CI keeps its own current Linux architecture via pnpm's default.

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true

overrides:
  "@xmldom/xmldom": 0.8.15
  brace-expansion: 5.0.12
  esbuild: 0.28.1
  js-yaml: 4.3.2
  fast-uri: 3.1.9
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.5
  # Released security patches for website serving and source-map consumers.
  compression: 1.8.2
  source-map-js: 1.2.2
  undici@6.27.0: 6.29.1
  undici@7.28.0: 7.30.1
  # Honcho pins an older Zod v4 exactly; keep its security override scoped.
  "@honcho-ai/sdk>zod": 4.6.6

# Preserve legacy minimatch APIs with brace-expansion 5 and backport the
# bounded level-two optimizer fix from minimatch 11.0.1 to versions 9 and 10.
# https://github.com/isaacs/minimatch/commit/77a0f5c4b80bdc641c3c930a1d9edf5ad2db57f8
patchedDependencies:
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  minimatch@5.1.9: patches/minimatch@5.1.9.patch
  minimatch@9.0.9: patches/minimatch@9.0.9.patch
  minimatch@10.2.5: patches/minimatch@10.2.5.patch

minimumReleaseAgeExclude:
  - better-sqlite3@13.0.1
  - react-dom@19.2.8
  - react@19.2.8
