packages:
  - apps/*
  - packages/*

# Optional native packages follow the host that runs install. The desktop app
# ships only Apple Silicon arm64, so M1 and later Macs share one binary family.
# Website CI keeps its own current Linux architecture via pnpm's default.

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true

overrides:
  "@xmldom/xmldom": 0.8.15
  brace-expansion: 5.0.12
  esbuild: 0.28.1
  js-yaml: 4.3.2
  fast-uri: 3.1.8
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.5
  # Released security patches for website serving and source-map consumers.
  compression: 1.8.2
  source-map-js: 1.2.2
  undici@6.27.0: 6.28.1
  undici@7.28.0: 7.29.1
  "fast-uri@>=3.0.0 <3.1.6": "3.1.8"

minimumReleaseAgeExclude:
  - better-sqlite3@13.0.1
  - electron@43.7.7
  - react-dom@19.2.8
  - react@19.2.8
