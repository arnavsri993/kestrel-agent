packages:
  - apps/*
  - packages/*

# Optional native packages follow the host that runs install. The desktop app
# ships only Apple Silicon arm64, so M1 and later Macs share one binary family.
# Website CI keeps its own current Linux architecture via pnpm's default.

allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true

overrides:
  "@xmldom/xmldom": 0.8.15
  brace-expansion: 5.0.9
  esbuild: 0.28.1
  js-yaml: 4.3.2
  fast-uri: 3.1.6
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.4
  undici@6.27.0: 6.28.0
  undici@7.28.0: 7.29.0
  "fast-uri@>=3.0.0 <3.1.6": "3.1.6"

minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - better-sqlite3@13.0.1
  - electron@43.4.0
  - next@16.3.3
  - react-dom@19.2.8
  - react@19.2.8
