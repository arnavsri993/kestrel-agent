appId: com.kestrel.desktop
productName: Kestrel
copyright: Copyright © 2026 Kestrel contributors
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/@img/**/*
  - node_modules/**/*.node
protocols:
  - name: Kestrel Protocol
    schemes:
      - kestrel
  - name: Web Browser Protocol
    schemes:
      - http
      - https
fileAssociations:
  - ext:
      - html
      - htm
      - shtml
      - xhtml
    name: HTML Document
    role: Viewer
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
    - target: pkg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  artifactName: Kestrel-Apple-Silicon-${version}.${ext}
  minimumSystemVersion: "13.0.0"
dmg:
  title: Kestrel
  contents:
    - x: 160
      y: 180
    - x: 480
      y: 180
      type: link
      path: /Applications
publish:
  - provider: generic
    url: ${env.KESTREL_UPDATE_URL}
    channel: latest
afterPack: build/after-pack.cjs
