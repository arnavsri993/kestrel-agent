extends: electron-builder.yml
mac:
  # This target is for local installation checks only. Public releases must
  # use the Developer ID signing and notarization job in CI.
  identity: "-"
  entitlementsInherit: build/entitlements.mac.dev.inherit.plist
  extendInfo:
    NSAppleEventsUsageDescription: "Kestrel uses System Events to identify the active app and perform desktop input that you approve."
    NSCameraUsageDescription: "Kestrel lets you approve camera access for trusted websites."
    NSMicrophoneUsageDescription: "Kestrel lets you approve microphone access for trusted websites."
    LSEnvironment:
      KESTREL_RELEASE_CHANNEL: stable
