<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-__KESTREL_RENDERER_CSP_NONCE__'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:* ws://localhost:*; media-src 'self' data:; object-src 'none'; frame-src data:; child-src data:; base-uri 'none'; form-action 'self'" />
    <link rel="icon" href="/assets/kestrel-favicon.svg" type="image/svg+xml" />
    <title>Kestrel</title>
  </head>
  <body>
    <svg aria-hidden="true" width="0" height="0" style="position:absolute;pointer-events:none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="kestrel-glass-refraction" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.012 0.025" numOctaves="1" seed="8" result="waves" />
          <feGaussianBlur in="waves" stdDeviation="2" result="smoothWaves" />
          <feDisplacementMap in="SourceGraphic" in2="smoothWaves" scale="16" xChannelSelector="R" yChannelSelector="G" result="refracted" />
          <feGaussianBlur in="refracted" stdDeviation="0.5" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src.tsx"></script>
  </body>
</html>
